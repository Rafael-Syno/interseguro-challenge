<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factorización QR · Coding Challenge Interseguro</title>
<style>
  :root {
    --ink: #10233a;
    --ink-soft: #5b708a;
    --paper: #eef3f8;
    --panel: #ffffff;
    --brand: #0091da;
    --brand-deep: #00639b;
    --rule: #d3dfea;
    --zero: #a9bccd;
    --alert: #b4342b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    background:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(90deg, rgba(0,145,218,.06) 0 1px, transparent 1px 28px);
    background-blend-mode: normal;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { margin-bottom: 2rem; max-width: 62ch; }
  h1 { font-size: 1.9rem; font-weight: 650; letter-spacing: -.02em; margin: 0 0 .4rem; }
  header p { margin: 0; color: var(--ink-soft); }
  .grid { display: grid; gap: 1.25rem; grid-template-columns: minmax(320px, 380px) 1fr; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 1.25rem; }
  h2 { font-size: .95rem; font-weight: 650; margin: 0 0 .75rem; }
  label { display: block; font-size: .82rem; color: var(--ink-soft); margin: .9rem 0 .3rem; }
  textarea, input {
    width: 100%; font-family: var(--mono); font-size: .88rem; color: var(--ink);
    background: #fbfdff; border: 1px solid var(--rule); border-radius: 4px; padding: .6rem .7rem;
    margin-top: .9rem;
  }
  textarea { min-height: 100px; resize: vertical; line-height: 1.7; }
  textarea:focus, input:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .row { display: flex; gap: .6rem; margin-top: .9rem; }
  .row > * { flex: 1; }
  .row input { margin-top: 0; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 4px; padding: .65rem 1rem;
    border: 1px solid var(--brand-deep); background: var(--brand); color: #fff; width: 100%; margin-top: .75rem;
  }
  button:hover { background: var(--brand-deep); }
  button[disabled] { opacity: .55; cursor: progress; }
  button.ghost { background: transparent; color: var(--brand-deep); border-color: var(--rule); margin-top: .5rem; font-weight: 500; }
  .samples { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
  .samples button { width: auto; margin: 0; padding: .3rem .6rem; font-size: .78rem; background: #eaf4fb; color: var(--brand-deep); border-color: #cbe3f3; font-weight: 500; }
  .matrix { display: inline-block; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); padding: .35rem .55rem; margin: .1rem .9rem .9rem 0; }
  .matrix table { border-collapse: collapse; font-family: var(--mono); font-size: .84rem; }
  .matrix td { padding: .18rem .55rem; text-align: right; font-variant-numeric: tabular-nums; }
  .matrix td.zero { color: var(--zero); }
  .caption { font-size: .78rem; color: var(--ink-soft); margin: 0 0 .2rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .1rem; border-top: 1px solid var(--rule); margin-top: .25rem; }
  .stat { padding: .7rem .1rem; border-bottom: 1px solid var(--rule); }
  .stat dt { font-size: .78rem; color: var(--ink-soft); margin-bottom: .15rem; }
  .stat dd { margin: 0; font-family: var(--mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .flag { color: var(--brand-deep); font-weight: 600; }
  .msg { border-left: 3px solid var(--alert); background: #fdf1f0; color: #7d2620; padding: .7rem .9rem; border-radius: 0 4px 4px 0; font-size: .88rem; }
  .empty { color: var(--ink-soft); font-size: .9rem; }
  .status { font-size: .8rem; color: var(--ink-soft); margin-top: .6rem; min-height: 1.2em; }
  section + section { margin-top: 1.25rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Factorización QR de una matriz</h1>
    <p>Escribe una matriz rectangular: la API en Go la descompone en Q y R, y la API en Node.js calcula las estadísticas sobre ambas.</p>
  </header>

  <div class="grid">
    <form class="panel" id="form" autocomplete="off">
      <h2>Matriz de entrada</h2>
      <textarea id="matrix" spellcheck="false">12 -51 4
6 167 -68
-4 24 -41</textarea>
      <input id="api" value="http://localhost:8080">
      <div class="row">
        <div>
          <input id="clientId" value="interseguro">
        </div>
        <div>
          <input id="clientSecret" type="password" value="challenge2001">
        </div>
      </div>

      <button type="submit" id="submit">Factorizar</button>
    </form>

    <div>
      <section class="panel" id="resultPanel">
        <h2>Resultado</h2>
        <p class="empty" id="placeholder">Aún no has enviado ninguna matriz.</p>
        <div id="output" hidden>
          <div id="matrices"></div>
          <h2 style="margin-top:1.4rem">Estadísticas de Q y R</h2>
          <dl class="stats" id="stats"></dl>
          <p class="caption" id="diagonal"></p>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

/** Convierte el texto del textarea en un array de arrays de números. */
function parseMatrix(text) {
  const rows = text.trim().split('\n').map((line) => line.trim()).filter(Boolean);
  if (!rows.length) throw new Error('Escribe al menos una fila.');
  const matrix = rows.map((line, i) => line.split(/[\s,;]+/).map((token) => {
    const value = Number(token);
    if (!Number.isFinite(value)) throw new Error(`"${token}" (fila ${i + 1}) no es un número.`);
    return value;
  }));
  const columns = matrix[0].length;
  if (matrix.some((row) => row.length !== columns)) throw new Error('Todas las filas deben tener la misma cantidad de columnas.');
  return matrix;
}

function renderMatrix(data) {
  const body = data.map((row) => '<tr>' + row.map((v) => {
    const zero = Math.abs(v) < 1e-9;
    const shown = zero ? '0' : (Number.isInteger(v) ? v : v.toFixed(4));
    return `<td class="${zero ? 'zero' : ''}">${shown}</td>`;
  }).join('') + '</tr>').join('');
  return `<div><div class="matrix"><table>${body}</table></div></div>`;
}

function renderStats(overall) {
  const items = [
    ['Valor máximo', overall.max],
    ['Valor mínimo', overall.min],
    ['Promedio', overall.average],
    ['Suma total', overall.sum],
    ['Valores analizados', overall.values]
  ];
  $('stats').innerHTML = items.map(([label, value]) =>
    `<div class="stat"><dt>${label}</dt><dd>${typeof value === 'number' ? Number(value.toFixed(4)) : value}</dd></div>`
  ).join('');
  $('diagonal').innerHTML = overall.anyDiagonal
    ? `<span class="flag">${overall.diagonalMatrices.join(', ')}</span>`
    : '';
}

function fail(message) {
  $('placeholder').hidden = true;
  $('output').hidden = true;
  $('resultPanel').querySelectorAll('.msg').forEach((n) => n.remove());
  $('resultPanel').insertAdjacentHTML('beforeend', `<p class="msg">${message}</p>`);
}

document.querySelectorAll('[data-sample]').forEach((button) => {
  button.addEventListener('click', () => { $('matrix').value = button.dataset.sample; });
});

$('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const base = $('api').value.replace(/\/$/, '');
  $('resultPanel').querySelectorAll('.msg').forEach((n) => n.remove());

  let matrix;
  try {
    matrix = parseMatrix($('matrix').value);
  } catch (err) {
    return fail(err.message);
  }

  $('submit').disabled = true;

  try {
    const auth = await fetch(`${base}/api/v1/auth/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_id: $('clientId').value, client_secret: $('clientSecret').value })
    });
    const authBody = await auth.json();
    if (!auth.ok) throw new Error(authBody.error?.message || 'No se pudo obtener el token.');

    const res = await fetch(`${base}/api/v1/matrix/qr`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authBody.access_token}` },
      body: JSON.stringify({ matrix })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'La API devolvió un error.');

    $('matrices').innerHTML = renderMatrix(data.factorization.Q) + renderMatrix(data.factorization.R);
    renderStats(data.statistics.statistics.overall);
    $('placeholder').hidden = true;
    $('output').hidden = false;
  } catch (err) {
    fail(err.message);
  } finally {
    $('submit').disabled = false;
  }
});
</script>
</body>
</html>
